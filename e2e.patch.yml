# E2E overlay: mount dsh-svg-motion + the driver that exercises it once.
# Relative to the repo root — run the dsh command from this directory.
- insert:
    - id: svg-motion
      name: ./lib/index.js
      inject: [tools]
    - id: svg-motion-e2e
      name: ./lib/e2e-driver.js
      inject: [tools]
